<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web调试通道</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #fff;
      padding: 15px 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    h1 {
      font-size: 18px;
      color: #333;
    }

    .user-select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      min-width: 200px;
    }

    .show-qr-btn {
      padding: 8px 16px;
      background: #07c160;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .show-qr-btn:hover {
      background: #06ad56;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 15px;
      max-width: 80%;
    }

    .message.inbound {
      margin-right: auto;
    }

    .message.outbound {
      margin-left: auto;
    }

    .message-header {
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
    }

    .message.inbound .message-header {
      text-align: left;
    }

    .message.outbound .message-header {
      text-align: right;
    }

    .timestamp {
      font-family: monospace;
    }

    .message.inbound .message-header {
      text-align: left;
    }

    .message.outbound .message-header {
      text-align: right;
      justify-content: flex-end;
    }

    .user-id {
      font-size: 11px;
      color: #07c160;
      font-family: monospace;
    }

    .message-body {
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.inbound .message-body {
      background: #fff;
      border: 1px solid #e0e0e0;
    }

    .message.outbound .message-body {
      background: #07c160;
      color: white;
    }

    .input-container {
      background: #fff;
      padding: 15px 20px;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }

    .input-field {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      resize: none;
      height: 44px;
      line-height: 18px;
    }

    .input-field:focus {
      outline: none;
      border-color: #07c160;
    }

    .send-btn {
      padding: 12px 24px;
      background: #07c160;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    .send-btn:hover {
      background: #06ad56;
    }

    .send-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .timestamp {
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Web调试通道</h1>
  </div>

  <div class="messages-container" id="messages"></div>

  <div class="input-container">
    <input type="text" id="messageInput" class="input-field" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>发送</button>
  </div>

  <script>
    let eventSource = null;
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function init() {
      connectSSE();
      loadMessages();
    }

    function connectSSE() {
      if (eventSource) {
        eventSource.close();
      }

      eventSource = new EventSource('/api/events');
      eventSource.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        addMessage(msg);
      };
      eventSource.onerror = (e) => {
        console.error('SSE error:', e);
        eventSource.close();
      };
    }

    function loadMessages() {
      messagesContainer.innerHTML = '';
      fetch('/api/messages')
        .then(res => res.json())
        .then(data => {
          data.messages.forEach(msg => addMessage(msg));
          scrollToBottom();
        });
    }

    function addMessage(msg) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${msg.direction}`;

      const headerDiv = document.createElement('div');
      headerDiv.className = 'message-header';
      const date = new Date(msg.timestamp);
      headerDiv.innerHTML = `<span class="timestamp">${date.toLocaleString('zh-CN')}</span>`;

      const bodyDiv = document.createElement('div');
      bodyDiv.className = 'message-body';
      bodyDiv.textContent = msg.content;

      msgDiv.appendChild(headerDiv);
      msgDiv.appendChild(bodyDiv);
      messagesContainer.appendChild(msgDiv);
      scrollToBottom();
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function sendMessage() {
      const content = messageInput.value.trim();
      if (!content) return;

      sendBtn.disabled = true;
      fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            messageInput.value = '';
          }
        })
        .catch(err => {
          console.error('Failed to send message:', err);
        })
        .finally(() => {
          sendBtn.disabled = false;
        });
    }

    init();
  </script>
</body>
</html>
